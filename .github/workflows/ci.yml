name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Format, lint (incl. architecture boundaries), stylelint, typecheck, knip, the Playwright
      # smoke tests (screenshot tests are local-only) and the build.
      - run: npm run check
